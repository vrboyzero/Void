# Bundle layer for @void/void-legion. Applied when a profile lists this bundle.
- insert:
    - id: void-legion
      name: "@void/void-legion/service"
    - id: void-legion-tool
      name: "@void/void-legion/tool"
    - id: void-legion-run-tool
      name: "@void/void-legion/run-tool"
    # 派活名单的 Agent 通道（legion_policy）。授权只由面板发放；没有授权时这个工具只能读。
    - id: void-legion-policy-tool
      name: "@void/void-legion/policy-tool"
    # 业务详情视图（队伍/任务）。没有 voidSuite 的组合里它不生效，军团照常工作。
    - id: void-legion-detail
      name: "@void/void-legion/detail-view"
    # 终态通知来源（断线补读）。同样：没有入口面板时不生效，军团照常工作。
    - id: void-legion-notifications
      name: "@void/void-legion/notification-source"
    # 外部触发来源（B8）：GitHub 通知轮询。来源文件不存在时自动不工作。
    - id: void-legion-source-github
      name: "@void/void-legion/source-github"
    # 飞书入站来源（B8-2）：WS 长连接；来源文件不存在时自动不工作。
    - id: void-legion-source-feishu
      name: "@void/void-legion/source-feishu"
    # 外部来源的统一页签：GitHub 与飞书合成一页，含可编辑配置与保存。
    # 两个来源服务都就绪后才登记视图；缺一个就不登记（不显示半页）。
    - id: void-legion-source-panel
      name: "@void/void-legion/source-panel"
