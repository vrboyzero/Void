# Bundle layer for @void/void-dsh-control（灵榜控制面）。
#
# 这是「组合层」配置：它给出插件在 profile 中的默认值，用户在 profile 自己的
# cordis.patch.yml 里按 id 覆盖同名行即可，不需要改这个文件。
#
# 回滚：删掉 profile 里的这一行，或把 enabled 改成 false，然后重启 Web profile。
# 端点会立即消失；账本、Session 日志和 Workspace 目录都不会被删除。
- insert:
    - id: void-dsh-control
      name: "@void/void-dsh-control"
      config:
        enabled: true
        transport: streamable-http
        path: /mcp/dsh-agent-control

        # token 只从环境变量读取；值本身永远不写进任何配置文件。
        # 变量未设置时插件会 warn 并且所有请求返回 401（不会降级成无认证端点）。
        tokens:
          - callerId: default
            tokenEnv: VOID_DSH_CONTROL_TOKEN
            operations:
              - workspace.read
              - workspace.open
              - session.list
              - session.create
              - session.prompt
              - session.inject
              - session.observe
              - task.read
        allowAnonymous: false

        # 留空 = 完全禁用「按路径打开 Workspace」。要允许外部 Agent 用绝对路径
        # 登记项目目录，必须在这里显式列出允许的根目录。
        allowedRoots: []

        allowedOperations:
          - workspace.read
          - workspace.open
          - session.list
          - session.create
          - session.prompt
          - session.observe

        ledger: storage

        callerInstructions: ''
        requiredFields: []
        requiredDocumentRules: []
        forbiddenPatterns: []
        instructionsVersion: 0

        notifyEvents:
          - accepted
          - completed
          - failed

        # 可选回调 webhook：给不能一直保持 MCP 连接的调用方用。
        # 默认关闭。开启前必须在环境变量里放好 HMAC 共享密钥，否则插件启动即失败。
        # 负载只含任务摘要与游标；模型产出的助手文本需要显式打开
        # includeAssistantSummary 才会发送。
        callback:
          enabled: false
          url: ''
          secretEnv: VOID_DSH_CONTROL_CALLBACK_SECRET
          events:
            - completed
            - failed
            - cancelled
          timeoutMs: 10000
          maxAttempts: 5
          allowedHosts: []
          includeAssistantSummary: false
